name: qr_conecta
description: Comparte tu WhatsApp, Instagram y Facebook solo con quien escanea tu QR en persona.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  supabase_flutter: ^2.8.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  geolocator: ^14.1.2
  geocoding: ^5.0.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  share_plus: ^13.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/backgrounds/
