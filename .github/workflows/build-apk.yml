name: Generar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Revisar secretos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::warning::Faltan SUPABASE_URL o SUPABASE_KEY: la APK sale en MODO DEMO."
          else
            echo "Servidor real configurado."
          fi
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Falta KEYSTORE_BASE64: la APK se firma con una clave de prueba y no se podrá actualizar encima."
          fi

      - name: Preparar firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/conecta-upload.jks
            printf 'storeFile=conecta-upload.jks\nstorePassword=%s\nkeyAlias=conecta\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
          fi

      # Si en Settings > Secrets existen SUPABASE_URL y SUPABASE_KEY, la app usa el servidor real;
      # si no, arranca en modo demo.
      - name: Compilar APK
        run: |
          # La descarga de Gradle a veces falla con un error temporal (504); se reintenta.
          for i in 1 2 3 4; do
            flutter build apk --release \
              --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
              --dart-define=SUPABASE_KEY="${{ secrets.SUPABASE_KEY }}" && break
            if [ "$i" = 4 ]; then exit 1; fi
            echo "Reintentando en $((i * 30)) s..."; sleep $((i * 30))
          done
          cp build/app/outputs/flutter-apk/app-release.apk conecta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: conecta-apk
          path: conecta.apk

      - name: Publicar en Releases (enlace de descarga)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: Última versión
          body: APK generado automáticamente desde la rama main (commit ${{ github.sha }}).
          prerelease: true
          make_latest: false
          files: conecta.apk
